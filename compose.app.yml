# The web build and the app, shared by docker-compose.gemma.yml and docker-compose.qwen.yml.
services:
  # Builds the React frontend into web/dist, then exits.
  web:
    image: node:20-alpine
    container_name: notetaker-web
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /web
    volumes:
      - ./web:/web
    command: sh -c "npm install --no-audit --no-fund && npm run build"

  # Pre-built PyTorch image: already has CUDA 12.6 + cuDNN 9 for Whisper. The code is mounted, not copied,
  # and Python packages live in a persistent venv, so restarts skip installs and code changes need no rebuild.
  app:
    image: pytorch/pytorch:2.6.0-cuda12.6-cudnn9-runtime
    container_name: notetaker-app
    # The LLM is defined in docker-compose.gemma.yml or docker-compose.qwen.yml; the app copes with it starting later.
    depends_on:
      web:
        condition: service_completed_successfully
    working_dir: /app
    ports:
      - "8443:8443"
    volumes:
      - ./server:/app/server
      - ./web/dist:/app/web/dist
      - ./data:/data
      - notetaker-venv:/venv
      - ${HOME}/.cache/huggingface:/hf
    environment:
      APP_UID: ${UID:-1000}
      APP_GID: ${GID:-1000}
      DATA_DIR: /data
      HF_HOME: /hf
      HOME: /tmp
      PYTHONUNBUFFERED: "1"
      LD_LIBRARY_PATH: /opt/conda/lib/python3.11/site-packages/nvidia/cublas/lib:/opt/conda/lib/python3.11/site-packages/nvidia/cudnn/lib
      LLM_URL: http://llm:8080/v1
      LLM_API_KEY: ${LLM_API_KEY:-test}
      # Speech-to-text: "granite" (IBM Granite Speech 4.1 2B) or "whisper" (faster-whisper large-v3-turbo).
      ASR_ENGINE: granite
      GRANITE_MODEL: ibm-granite/granite-speech-4.1-2b
      WHISPER_MODEL: large-v3-turbo
      WHISPER_LANGUAGE: en
      # Add this machine's LAN IP / hostname so they appear in the self-signed certificate.
      TLS_HOSTS: ${TLS_HOSTS:-}
    # Installs git and Python packages on first start (fast no-ops after), then runs the server
    # as your user so files in ./data stay yours.
    command:
      - bash
      - -c
      - |
        set -e
        command -v git >/dev/null || { apt-get update -qq && apt-get install -y -qq --no-install-recommends git >/dev/null; }
        [ -x /venv/bin/python ] || python -m venv --system-site-packages /venv
        /venv/bin/pip install -q --disable-pip-version-check -r server/requirements.txt
        exec setpriv --reuid=$$APP_UID --regid=$$APP_GID --clear-groups /venv/bin/python -m server.main
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  notetaker-venv:
